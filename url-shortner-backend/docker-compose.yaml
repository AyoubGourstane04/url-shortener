services:
  url-shortner-db:
    image: postgres:16
    container_name: url-shortner-db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: url-shortner-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: